<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — Liftwithsultan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">LIFT<span>WITH</span>SULTAN</a>
        <nav class="nav" id="nav">
          <a href="index.html#plans">Workout Plans</a>
          <a href="index.html#how">How It Works</a>
          <a href="signup.html" class="btn btn-small">Get Started</a>
        </nav>
        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="Toggle menu"
          aria-expanded="false"
        >
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <!-- ===== LOG IN ===== -->
    <section class="auth-section">
      <div class="container auth-wrap auth-wrap-centered">
        <div class="auth-card">
          <p class="eyebrow">Welcome back</p>
          <h1 class="auth-title">Log in to your account</h1>
          <p class="auth-sub">Pick up your plan right where you left off.</p>

          <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
              <label for="loginEmail">Email address</label>
              <input
                type="email"
                id="loginEmail"
                name="loginEmail"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
              <span class="field-error" data-for="loginEmail"></span>
            </div>

            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input
                type="password"
                id="loginPassword"
                name="loginPassword"
                placeholder="Your password"
                autocomplete="current-password"
                required
              />
              <span class="field-error" data-for="loginPassword"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
              Log In
            </button>

            <p id="loginSuccess" class="form-success" hidden>
              Logged in! (This is a UI demo — no real account was checked.)
            </p>
          </form>

          <p class="auth-switch">
            Don't have an account yet? <a href="signup.html">Sign up</a>
          </p>
        </div>
      </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Liftwithsultan. Built for people on day one.</p>
      </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
